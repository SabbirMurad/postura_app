name: posture_detector_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_gen: ^5.12.0
  get: ^4.7.3
  google_fonts: ^6.3.2
  flutter_screenutil: ^5.9.3
  smooth_page_indicator: ^1.2.1
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.2.3
  flutter_native_splash: ^2.4.7
  camera: ^0.10.5+3
  percent_indicator: ^4.2.5
  iconsax: ^0.0.8
  flutter_otp_text_field: ^1.5.1+1
  shared_preferences: ^2.5.4
  connectivity_plus: ^7.0.0
  image_picker: ^1.1.1
  http: ^1.6.0
  sqflite: ^2.4.2
  cached_network_image: ^3.3.1
  path: ^1.8.3
  flutter_localizations:
    sdk: flutter
  thinksys_mediapipe_plugin: ^0.0.13
  path_provider: ^2.1.1 # For getting downloads directory
  dio: ^5.4.0
  flutter_downloader: ^1.11.7
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  flutter_gen_runner: ^5.12.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logos/android_launcher_icon.png"
  adaptive_icon_background: "#7D9FFE"
  adaptive_icon_foreground: "assets/images/logos/android_launcher_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logos/android_launcher_icon.png"
    background_color: "#7D9FFE"
    theme_color: "#7D9FFE"
  windows:
    generate: true
    image_path: "assets/images/logos/android_launcher_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logos/android_launcher_icon.png"

flutter_gen:
  output: lib/gen/
  integrations:
    image: true
    flutter_svg: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Icons
    - assets/icons/flags/
    - assets/icons/nav/
    - assets/icons/auth/
    - assets/icons/status/
    - assets/icons/workplace/
    - assets/icons/general/
    # Images
    - assets/images/logos/
    - assets/images/onboarding/
    - assets/images/camera/
    - assets/images/report/
    - assets/images/general/
    # Models
    - assets/models/yolo11n_pose.pt
    - assets/models/yolo11n.pt
    - assets/models/movenet_lightning.tflite
    - assets/models/movenet_thunder.tflite
